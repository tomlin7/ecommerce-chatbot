services:
  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - sqlite_data:/app/instance
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  sqlite_data:
